<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌻 Condomínio Girassol</title>
<style>
:root{--am:#d97706;--am2:#f59e0b;--am3:#fef3c7;--cinza:#f4f6f8;--borda:#e2e8f0;--txt:#1a1a2e;--br:#fff;--vm:#dc2626;--vd:#16a34a;--az:#1d4ed8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#c8cfd8;color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
.folha{width:100%;max-width:1280px;background:#f4f6f8;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;}
#tela-login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#d97706,#92400e);flex:1;}
.login-box{background:#fff;border-radius:16px;padding:48px 40px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.linput{width:100%;padding:12px 16px;border:2px solid var(--borda);border-radius:8px;font-size:15px;outline:none;margin-bottom:12px;}
.linput:focus{border-color:var(--am);}
.lbtn{width:100%;padding:13px;background:var(--am);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;}
#app{display:none;}
.header{background:var(--am);color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.hbtn{padding:6px 12px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;}
.comp-bar{background:#fff;border-bottom:1px solid var(--borda);padding:10px 20px;display:flex;align-items:center;gap:12px;}
.comp-mes{font-size:19px;font-weight:700;color:var(--am);}
.bnav{padding:5px 12px;border:1px solid var(--borda);background:#fff;border-radius:6px;font-size:13px;cursor:pointer;}
.bnav:hover{background:var(--am);color:#fff;border-color:var(--am);}
.tabs{background:#fff;border-bottom:1px solid var(--borda);padding:0 20px;display:flex;overflow-x:auto;}
.tab{padding:13px 18px;font-size:13px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;color:#6b7280;}
.tab:hover,.tab.ativo{color:var(--am);}
.tab.ativo{border-bottom-color:var(--am);font-weight:600;}
.content{padding:20px;}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:20px;}
.rcard{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.rcard-lbl{font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.rcard-val{font-size:22px;font-weight:700;color:var(--am);}
.barra{background:#e2e8f0;border-radius:99px;height:10px;overflow:hidden;margin:6px 0 4px;}
.bfill{height:100%;border-radius:99px;background:var(--am);}
.inad-card{background:#fff5f5;border:1px solid #fca5a5;border-radius:10px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.alerta{background:#fff8e1;border:1px solid #ffd54f;border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;}
.alerta.urg{background:#fff5f5;border-color:#fca5a5;}
.pcfg{background:#fff;border-radius:12px;padding:16px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;}
.pcampo{display:flex;flex-direction:column;gap:4px;}
.pclbl{font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;}
.pcinp{padding:7px 10px;border:1px solid var(--borda);border-radius:6px;font-size:14px;width:155px;outline:none;}
.pcinp:focus{border-color:var(--am);}
.btnrat{padding:8px 14px;background:var(--am);color:#fff;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;}
.modal-overlay.aberto{display:flex;}
.modal{background:#fff;border-radius:16px;padding:28px;width:600px;max-width:96vw;max-height:92vh;overflow-y:auto;}
.mtit{font-size:18px;font-weight:700;margin-bottom:20px;color:var(--am);}
.macs{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}
.bok{background:var(--am);color:#fff;border:none;border-radius:8px;padding:9px 22px;font-size:14px;font-weight:600;cursor:pointer;}
.bcan{background:#e2e8f0;color:var(--txt);border:none;border-radius:8px;padding:9px 22px;font-size:14px;cursor:pointer;}
.mc{margin-bottom:10px;}
.mc label{display:block;font-size:11px;color:#6b7280;font-weight:600;margin-bottom:3px;}
.mc input,.mc select,.mc textarea{width:100%;padding:8px 10px;border:1px solid var(--borda);border-radius:6px;font-size:14px;outline:none;font-family:inherit;}
.mc input:focus,.mc select:focus,.mc textarea:focus{border-color:var(--am);}
.mc2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fech-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px;}
.painel-linha{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px;}
.painel-linha:last-child{border-bottom:none;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--am);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:9999;opacity:0;transform:translateY(20px);transition:all .3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.erro{background:var(--vm);}
.doc{font-family:'Times New Roman',serif;font-size:13px;line-height:1.8;padding:30px;}
.doc h1{text-align:center;font-size:16px;margin-bottom:16px;}
.doc p{margin-bottom:10px;text-align:justify;}
.doc .assinaturas{margin-top:50px;display:grid;grid-template-columns:1fr 1fr;gap:30px;}
.doc .ass{text-align:center;border-top:1px solid #000;padding-top:6px;font-size:12px;}
/* Campo extra flexível */
.campo-extra-row{display:grid;grid-template-columns:1fr 1.5fr auto;gap:6px;align-items:end;margin-bottom:6px;}
.add-campo-btn{font-size:12px;color:var(--am);background:none;border:1px dashed var(--am);border-radius:7px;cursor:pointer;padding:5px 12px;font-weight:600;width:100%;margin-top:4px;}

.layout-u{display:flex;gap:16px;align-items:flex-start;}
.indice{position:sticky;top:70px;width:170px;flex-shrink:0;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);padding:8px;max-height:calc(100vh - 90px);overflow-y:auto;}
.indice-tit{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.8px;padding:4px 6px 6px;}
.ind-item{display:block;width:100%;text-align:left;border:none;border-left:4px solid #d1d5db;background:#f9fafb;border-radius:6px;padding:5px 8px;margin-bottom:4px;cursor:pointer;font-family:inherit;}
.ind-item .n{font-size:12px;font-weight:700;color:#374151;}
.ind-item .q{font-size:10px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ind-item.ok{border-left-color:#16a34a;background:#e8f5ee;}
.ind-item.ok .n{color:#166534;}
.ind-item.deb{border-left-color:#dc2626;background:#fff1f1;}
.ind-item.deb .n{color:#b91c1c;}
.ind-item:hover{filter:brightness(.96);}
.u-main{flex:1;min-width:0;}
.fech-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;align-items:start;}
@media(max-width:820px){.layout-u{flex-direction:column;}.indice{position:static;width:100%;max-height:none;display:flex;flex-wrap:wrap;gap:4px;}.ind-item{width:auto;min-width:96px;margin-bottom:0;}.indice-tit{width:100%;}}
</style>
</head>
<body>
<div class="folha">
<!-- LOGIN -->
<div id="tela-login">
  <div class="login-box">
    <div style="font-size:56px;margin-bottom:6px">🌻</div>
    <div style="font-size:22px;font-weight:700;color:var(--am);margin-bottom:4px">Condomínio Girassol</div>
    <div style="font-size:13px;color:#6b7280;margin-bottom:28px">Sistema de Gestão</div>
    <input type="password" id="login-senha" class="linput" placeholder="Senha de acesso" onkeydown="if(event.key==='Enter')fazerLogin()">
    <button class="lbtn" onclick="fazerLogin()">🌻 Entrar</button>
    <div id="login-erro" style="color:var(--vm);font-size:13px;margin-top:8px;display:none">Senha incorreta.</div>
  </div>
</div>
<!-- APP -->
<div id="app">
  <div class="header">
    <div>
      <div style="font-size:17px;font-weight:700">🌻 Condomínio Girassol</div>
      <div style="font-size:11px;opacity:.8" id="header-end">—</div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="hbtn" style="background:#27ae60;color:#fff" onclick="salvarNuvem()">☁️ Salvar</button>
      <button class="hbtn" style="background:#e67e22;color:#fff" onclick="carregarNuvem()">⬇️ Carregar</button>
      <button class="hbtn" style="background:#b45309;color:#fff" onclick="destravaTudo()">🔓 Destravar</button>
      <button class="hbtn" style="background:rgba(255,255,255,.2);color:#fff" onclick="sair()">Sair</button>
    </div>
  </div>
  <div class="comp-bar">
    <span style="font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase">📅 Competência</span>
    <button class="bnav" onclick="navMes(-1)">← Ant.</button>
    <span class="comp-mes" id="comp-label"></span>
    <select id="comp-select" style="padding:5px 8px;border:1px solid var(--borda);border-radius:6px;font-size:13px" onchange="mudarMes(this.value)"></select>
    <button class="bnav" onclick="navMes(1)">Próx. →</button>
  </div>
  <div class="tabs" id="tabs-wrapper"></div>
  <div class="content" id="content-area"></div>
</div>
</div>

<!-- MODAL NOVA UNIDADE -->
<div class="modal-overlay" id="modal-unidade">
  <div class="modal" style="width:360px">
    <div class="mtit">Nova Unidade</div>
    <div class="mc"><label>Número / Nome</label><input id="mu-numero" placeholder="Ex: AP. 501 ou Cobertura"></div>
    <div class="macs">
      <button class="bcan" onclick="fecharModal('modal-unidade')">Cancelar</button>
      <button class="bok" onclick="salvarNovaUnidade()">Adicionar</button>
    </div>
  </div>
</div>

<!-- MODAL DADOS DO CONDOMÍNIO -->
<div class="modal-overlay" id="modal-cond">
  <div class="modal">
    <div class="mtit">⚙️ Dados do Condomínio</div>
    <div class="mc2">
      <div class="mc"><label>Nome do Condomínio</label><input id="mc-nome" value="Condomínio Girassol"></div>
      <div class="mc"><label>CNPJ (se houver)</label><input id="mc-cnpj" placeholder="00.000.000/0000-00"></div>
      <div class="mc" style="grid-column:1/-1"><label>Endereço completo</label><input id="mc-end" placeholder="Rua, número, bairro, cidade/ES, CEP"></div>
      <div class="mc"><label>Síndico(a)</label><input id="mc-sindico" placeholder="Nome completo"></div>
      <div class="mc"><label>CPF do Síndico(a)</label><input id="mc-sindico-cpf" placeholder="000.000.000-00"></div>
      <div class="mc"><label>Telefone / WhatsApp</label><input id="mc-tel" placeholder="(27) 9xxxx-xxxx"></div>
      <div class="mc"><label>E-mail</label><input id="mc-email" placeholder="contato@girassol.com"></div>
      <div class="mc"><label>Chave PIX para pagamentos</label><input id="mc-pix" placeholder="CPF, e-mail ou telefone"></div>
      <div class="mc"><label>Banco / Conta</label><input id="mc-banco" placeholder="Ex: Nubank — Agência 0001 / Conta 12345-6"></div>
    </div>
    <!-- Campos extras do condomínio -->
    <div style="margin-top:10px">
      <div style="font-size:11px;font-weight:700;color:#888;text-transform:uppercase;margin-bottom:8px">Campos Adicionais</div>
      <div id="cond-extras-lista"></div>
      <button class="add-campo-btn" onclick="addCampoExtra('cond')">+ Adicionar campo</button>
    </div>
    <div class="macs">
      <button class="bcan" onclick="fecharModal('modal-cond')">Cancelar</button>
      <button class="bok" onclick="salvarDadosCond()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL DOCUMENTO -->
<div class="modal-overlay" id="modal-doc">
  <div class="modal" style="width:820px">
    <div class="mtit" id="modal-doc-titulo">Documento</div>
    <div id="modal-doc-body"></div>
    <div class="macs">
      <button class="bcan" onclick="fecharModal('modal-doc')">Fechar</button>
      <button class="bok" onclick="imprimirDoc()">🖨️ Imprimir / PDF</button>
    </div>
  </div>
</div>

<!-- MODAL SENHA -->
<div class="modal-overlay" id="modal-senha">
  <div class="modal" style="width:340px">
    <div class="mtit">🔒 Confirmar Senha</div>
    <div class="mc"><label>Senha</label><input type="password" id="modal-senha-input" onkeydown="if(event.key==='Enter')confirmarSenha()"></div>
    <div id="modal-senha-erro" style="color:var(--vm);font-size:13px;display:none">Senha incorreta.</div>
    <div class="macs">
      <button class="bcan" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="bok" onclick="confirmarSenha()">Confirmar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const SENHA='girassol';
const SHEETS_URL='https://script.google.com/macros/s/AKfycbzwJZobN-etaNZJW9EHEbU8lcKmDg1yQxBcE9goII-LTCe5aMk4leON1bg-Qi0nDZEr4Q/exec';
const CHAVE='girassol_v2';
const AUTH_KEY='girassol_auth_v2';
const COR='#d97706';
const MN=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MN_PT=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MN_UP=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];

let dados={cond:{nome:'Condomínio Girassol',endereco:'',cnpj:'',sindico:'',sindicoCpf:'',tel:'',email:'',pix:'',banco:'',extras:[]},unidades:[],meses:{}};
let mesSel='', abaAtiva='unidades', _cbSenha=null;

// ===== LOGIN =====
function fazerLogin(){
  if(document.getElementById('login-senha').value===SENHA){
    sessionStorage.setItem(AUTH_KEY,'1');
    document.getElementById('tela-login').style.display='none';
    document.getElementById('app').style.display='block';
    iniciar();
  } else document.getElementById('login-erro').style.display='block';
}
function sair(){sessionStorage.removeItem(AUTH_KEY);location.reload();}

function iniciar(){
  const h=new Date();
  mesSel=`${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}`;
  carregarLocal();
  limparCond();
  if(!dados.unidades||dados.unidades.length===0) criarUnidadesIniciais();
  if(!dados.cond)dados.cond={nome:'Condomínio Girassol',endereco:'',cnpj:'',sindico:'',sindicoCpf:'',tel:'',email:'',pix:'',banco:'',extras:[]};
  if(!dados.cond.extras)dados.cond.extras=[];
  atualizarHeaderEnd();
  renderCompetencia(); renderTabs(); renderContent();
}
function limparCond(){if(dados&&dados.unidades)dados.unidades=dados.unidades.filter(u=>!(u.numero==='Unidade Cond.'||u.numero==='COND'));}
function carregarLocal(){const d=localStorage.getItem(CHAVE);if(d){try{dados=JSON.parse(d);}catch(e){}}}
function sv(){localStorage.setItem(CHAVE,JSON.stringify(dados));}

function criarUnidade(num){
  return {
    id:'u_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    numero: 'AP. '+num,
    locatario:{nome:'',cpf:'',rg:'',tel:'',email:'',endereco:'',instalacao_edp:'',matricula_cesan:'',cotas_agua:1,data_assinatura:'',vencimento_contrato:'',caucao_tipo:'avista',caucao_valor:'',obs:'',extras:[]},
    locador:{nome:'',cpf:'',rg:'',tel:'',email:'',endereco:'',extras:[]},
    aluguel:0,condominio:0,energia_tipo:'transferida',energia_pct:0,
    extras_imovel:[]
  };
}
function criarUnidadesIniciais(){
  ['101','102','103','104','105','201','202','203','204','205','206','301','302','303','304','305','401','402','403','404','405'].forEach(n=>dados.unidades.push(criarUnidade(n)));
  sv();
}
function atualizarHeaderEnd(){
  document.getElementById('header-end').textContent=dados.cond&&dados.cond.endereco?dados.cond.endereco:'—';
}

// ===== COMPETÊNCIA =====
function labelMes(m){const[y,mo]=m.split('-');return `${MN[parseInt(mo)-1]}/${y}`;}
function renderCompetencia(){
  document.getElementById('comp-label').textContent=labelMes(mesSel);
  const sel=document.getElementById('comp-select'); sel.innerHTML='';
  const[y,mo]=mesSel.split('-').map(Number);
  for(let i=-12;i<=12;i++){
    const d=new Date(y,mo-1+i,1);
    const v=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const o=document.createElement('option');
    o.value=v;o.textContent=labelMes(v);if(v===mesSel)o.selected=true;
    sel.appendChild(o);
  }
}
function mudarMes(v){mesSel=v;renderCompetencia();renderContent();}
function navMes(d){
  const[y,mo]=mesSel.split('-').map(Number);
  const dt=new Date(y,mo-1+d,1);
  mesSel=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
  renderCompetencia();renderContent();
}
function mesPrev(m){const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo-2,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}

// ===== TABS =====
function renderTabs(){
  const w=document.getElementById('tabs-wrapper'); w.innerHTML='';
  [{id:'unidades',l:'🏢 Unidades'},{id:'painel',l:'📊 Painel'},{id:'fechamento',l:'📈 Fechamento'}].forEach(a=>{
    const t=document.createElement('div');
    t.className='tab'+(abaAtiva===a.id?' ativo':'');
    t.textContent=a.l; t.onclick=()=>{abaAtiva=a.id;renderTabs();renderContent();};
    w.appendChild(t);
  });
  const tc=document.createElement('div');
  tc.className='tab';tc.style.color=COR;tc.style.fontWeight='600';
  tc.textContent='⚙️ Condomínio';tc.onclick=()=>abrirModalCond();
  w.appendChild(tc);
}

function renderContent(){
  const area=document.getElementById('content-area');
  if(abaAtiva==='painel'){renderPainel(area);return;}
  if(abaAtiva==='fechamento'){renderFechamento(area);return;}
  renderUnidades(area);
}

// ===== UNIDADES (VISÃO GERAL) =====
function renderUnidades(area){
  let totalMes=0,recebMes=0;
  dados.unidades.forEach(u=>{
    const m=dados.meses[`${u.id}__${mesSel}`]||{};
    const t=calcTotal(u,m);
    const pags=(m.pagamentos||[]).reduce((s,pg)=>s+(parseFloat(pg.valor)||0),0);
    totalMes+=t; recebMes+=pags>0?pags:(m.quitado?t:(parseFloat(m.pago)||0));
  });
  const pct=totalMes>0?Math.round(recebMes/totalMes*100):0;

  const hoje=new Date(),em60=new Date();em60.setDate(hoje.getDate()+60);
  let alertasHTML='',inadHTML='',qtdInad=0;
  dados.unidades.forEach(u=>{
    const vc=u.locatario&&u.locatario.vencimento_contrato||'';
    if(vc){const dv=parseDateVenc(vc);if(dv&&dv<=em60){const urg=dv<=hoje;alertasHTML+=`<div class="alerta${urg?' urg':''}"><span>${urg?'🔴':'⚠️'}</span><span><strong>${u.numero}</strong> — ${u.locatario.nome||'—'}: contrato ${urg?'VENCIDO':'vence em breve'} (${vc})</span></div>`;}}
    const m=dados.meses[`${u.id}__${mesSel}`]||{};
    const t=calcTotal(u,m);
    const pags=(m.pagamentos||[]).reduce((s,pg)=>s+(parseFloat(pg.valor)||0),0);
    const pago=pags>0?pags:(m.quitado?t:(parseFloat(m.pago)||0));
    if(!m.quitado&&pago<t&&t>0){qtdInad++;inadHTML+=`<div class="inad-card"><div><div style="font-weight:600;color:var(--vm);font-size:14px">${u.locatario&&u.locatario.nome||'—'}</div><div style="font-size:12px;color:#6b7280">${u.numero} · ${u.locatario&&u.locatario.tel||'—'}</div></div><div style="display:flex;align-items:center;gap:10px"><span style="font-size:16px;font-weight:700;color:var(--vm)">R$ ${fmtR(t-pago)}</span><button onclick="enviarCobranca('${u.id}')" style="padding:6px 12px;background:var(--am);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">📱 Cobrar</button></div></div>`;}
  });

  const pc=dados.meses[`cond_cfg__${mesSel}`]||{};
  const tcx=totalCotas(pc);
  const vCotaX=(parseFloat(pc.conta_agua)>0&&tcx.total>0)?parseFloat(pc.conta_agua)/tcx.total:0;
  let indHTML='<div class="indice"><div class="indice-tit">Índice</div>';

function setCondCfg(campo,val){
  const k=`cond_cfg__${mesSel}`;
  if(!dados.meses[k])dados.meses[k]={};
  dados.meses[k][campo]=parseFloat(val)||0; sv();
}

function setCondCfgTxt(campo,val){
  const k=`cond_cfg__${mesSel}`;
  if(!dados.meses[k])dados.meses[k]={};
  if(val===''||val===null)delete dados.meses[k][campo]; else dados.meses[k][campo]=parseFloat(val)||0;
  sv();renderContent();
}
function totalCotas(pc){
  let n=0,un=0;
  dados.unidades.forEach(u=>{const l=u.locatario||{};if((l.nome||'').trim()){n+=parseFloat(l.cotas_agua)||0;un++;}});
  const cc=(pc.cotas_cond!==undefined&&pc.cotas_cond!==null)?(parseFloat(pc.cotas_cond)||0):1;
  return{un,cotasMor:n,cc,total:n+cc};
}
function aguaEdif(pc){
  if(pc.agua_edif!==undefined&&pc.agua_edif!==null&&pc.agua_edif!=='')return parseFloat(pc.agua_edif)||0;
  const tc=totalCotas(pc),conta=parseFloat(pc.conta_agua)||0;
  return (conta>0&&tc.total>0)?Math.round(conta/tc.total*tc.cc*100)/100:0;
}
function statusUnid(u){
  const m=dados.meses[`${u.id}__${mesSel}`]||{};
  const t=calcTotal(u,m);
  const pags=(m.pagamentos||[]).reduce((s,pg)=>s+(parseFloat(pg.valor)||0),0);
  const pago=pags>0?pags:(m.quitado?t:(parseFloat(m.pago)||0));
  return{t,pago,saldo:Math.max(0,t-pago),quitado:t>0&&(m.quitado||pago>=t)};
}
function caucaoInfo(u){
  const l=u.locatario||{};const arr=l.caucao_pagtos||[];
  const pago=arr.reduce((s,x)=>s+(parseFloat(x.valor)||0),0);
  const comb=parseFloat(l.caucao_valor)||0;
  return{comb,pago,saldo:Math.max(0,comb-pago),arr};
}
function irUnidade(id){const el=document.getElementById('card-'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.style.outline='3px solid '+COR;setTimeout(()=>el.style.outline='',1500);}}
function addCaucao(unidId){const u=dados.unidades.find(x=>x.id===unidId);if(!u)return;if(!u.locatario)u.locatario={};if(!u.locatario.caucao_pagtos)u.locatario.caucao_pagtos=[];u.locatario.caucao_pagtos.push({data:new Date().toISOString().split('T')[0],valor:0});sv();renderContent();}
function remCaucao(unidId,i){const u=dados.unidades.find(x=>x.id===unidId);if(!u||!u.locatario||!u.locatario.caucao_pagtos)return;u.locatario.caucao_pagtos.splice(i,1);sv();renderContent();}
function setCaucao(unidId,i,campo,val){const u=dados.unidades.find(x=>x.id===unidId);if(!u||!u.locatario||!u.locatario.caucao_pagtos)return;u.locatario.caucao_pagtos[i][campo]=campo==='valor'?(parseFloat(val)||0):val;sv();renderContent();}

function ratearAgua(){
  const pc=dados.meses[`cond_cfg__${mesSel}`]||{};
  const conta=parseFloat(pc.conta_agua)||0;
  const tc=totalCotas(pc);
  if(!conta){toast('Preencha a conta de água!',true);return;}
  if(!tc.total){toast('Nenhuma cota para ratear!',true);return;}
  const vCota=conta/tc.total;
  dados.unidades.forEach(u=>{
    const l=u.locatario||{};
    if(!(l.nome||'').trim())return;
    const cotas=parseFloat(l.cotas_agua)||0;
    if(cotas>0){const mk=`${u.id}__${mesSel}`;if(!dados.meses[mk])dados.meses[mk]={};dados.meses[mk].agua_valor=Math.round(vCota*cotas*100)/100;}
  });
  sv();renderContent();toast(`💧 Água rateada em ${tc.total} cotas (${tc.un} unidades + condomínio)`);
}

function ratearEnergia(){
  const pc=dados.meses[`cond_cfg__${mesSel}`]||{};
  const conta=parseFloat(pc.conta_energia_total)||0;
  if(!conta){toast('Preencha a conta total de energia!',true);return;}
  dados.unidades.forEach(u=>{
    if(u.energia_tipo==='percentual'){const pct=parseFloat(u.energia_pct)||0;if(pct>0){const mk=`${u.id}__${mesSel}`;if(!dados.meses[mk])dados.meses[mk]={};dados.meses[mk].energia_valor=Math.round(conta*pct/100*100)/100;}}
  });
  sv();renderContent();toast('⚡ Energia rateada!');
}

function calcTotal(u,m){
  let t=(parseFloat(u.aluguel)||0)+(parseFloat(u.condominio)||0);
  t+=parseFloat(m.agua_valor)||0;
  t+=parseFloat(m.iptu)||0;
  t+=parseFloat(m.lixo)||0;
  t+=parseFloat(m.outros)||0;
  if(u.energia_tipo==='percentual')t+=parseFloat(m.energia_valor)||0;
  if(m.extras)m.extras.forEach(e=>t+=parseFloat(e.valor)||0);
  // campos extras de mês
  if(m.campos_extras)m.campos_extras.forEach(e=>t+=parseFloat(e.valor)||0);
  return t;
}

// ===== FECHAMENTO =====
function calcFech(mes){
  const pc=dados.meses[`cond_cfg__${mes}`]||{};
  const fu=dados.meses[`fundo_${mes}`]||{};
  const despList=pc.despesas||[];
  let rAlug=0,rCond=0,rAgua=0,rEn=0,rIPTU=0,rLixo=0,rOut=0,rExt=0,totalRec=0,totalInad=0,cauMes=0,cauTotal=0;
  dados.unidades.forEach(u=>{
    const m=dados.meses[`${u.id}__${mes}`]||{};
    const pags=(m.pagamentos||[]).reduce((s,pg)=>s+(parseFloat(pg.valor)||0),0);
    const tU=calcTotal(u,m);
    const recU=pags>0?pags:(m.quitado?tU:(parseFloat(m.pago)||0));
    const prop=(tU>0&&recU>0)?Math.min(recU/tU,1):0;
    totalRec+=recU;totalInad+=Math.max(0,tU-recU);
    rAlug+=(parseFloat(u.aluguel)||0)*prop;
    rCond+=(parseFloat(u.condominio)||0)*prop;
    rAgua+=(parseFloat(m.agua_valor)||0)*prop;
    if(u.energia_tipo==='percentual')rEn+=(parseFloat(m.energia_valor)||0)*prop;
    rIPTU+=(parseFloat(m.iptu)||0)*prop;
    rLixo+=(parseFloat(m.lixo)||0)*prop;
    rOut+=(parseFloat(m.outros)||0)*prop;
    const exts=(m.extras||[]).reduce((s,e)=>s+(parseFloat(e.valor)||0),0);
    const cext=(m.campos_extras||[]).reduce((s,e)=>s+(parseFloat(e.valor)||0),0);
    rExt+=(exts+cext)*prop;
    const ci=caucaoInfo(u);cauTotal+=ci.pago;
    ci.arr.forEach(x=>{if((x.data||'').slice(0,7)===mes)cauMes+=parseFloat(x.valor)||0;});
  });
  const aguaE=aguaEdif(pc);
  const totalDesp=aguaE+despList.reduce((s,d)=>s+(parseFloat(d.valor)||0),0);
  const saldoAnt=parseFloat(fu.saldo_ant)||0;
  const totalDisp=rCond+saldoAnt;
  const saldoCond=totalDisp-totalDesp;
  return{pc,fu,despList,rAlug,rCond,rAgua,rEn,rIPTU,rLixo,rOut,rExt,totalRec,totalInad,aguaE,totalDesp,saldoAnt,totalDisp,saldoCond,cauMes,cauTotal};
}
function proxMes(m){const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function replicarSaldo(sim){
  const f=calcFech(mesSel);
  const nx=proxMes(mesSel);
  const k=`fundo_${mesSel}`,kn=`fundo_${nx}`;
  if(!dados.meses[k])dados.meses[k]={};
  if(sim){
    const inp=document.getElementById('repl-valor');
    const v=inp?(parseFloat(inp.value)||0):f.saldoCond;
    if(!dados.meses[kn])dados.meses[kn]={};
    dados.meses[kn].saldo_ant=Math.round(v*100)/100;
    dados.meses[kn].origem=mesSel;
    dados.meses[k].decisao='sim';dados.meses[k].repl_valor=Math.round(v*100)/100;
    toast(`✓ Saldo de R$ ${fmtR(v)} replicado para ${labelMes(nx)}`);
  }else{
    dados.meses[k].decisao='nao';
    if(dados.meses[kn]){dados.meses[kn].saldo_ant=0;dados.meses[kn].origem='';}
    toast('Saldo não replicado.');
  }
  sv();renderContent();
}
function desfazerReplica(){
  const nx=proxMes(mesSel),k=`fundo_${mesSel}`,kn=`fundo_${nx}`;
  if(dados.meses[k])delete dados.meses[k].decisao;
  if(dados.meses[kn]&&dados.meses[kn].origem===mesSel){dados.meses[kn].saldo_ant=0;dados.meses[kn].origem='';}
  sv();renderContent();
}
function setSaldoAnt(val){const k=`fundo_${mesSel}`;if(!dados.meses[k])dados.meses[k]={};dados.meses[k].saldo_ant=parseFloat(val)||0;sv();renderContent();}
function setAguaEdif(val){const k=`cond_cfg__${mesSel}`;if(!dados.meses[k])dados.meses[k]={};if(val==='')delete dados.meses[k].agua_edif;else dados.meses[k].agua_edif=parseFloat(val)||0;sv();renderContent();}

function renderFechamento(area){
  const prevMes=mesPrev(mesSel),nxMes=proxMes(mesSel);

  const {despList,rAlug,rCond,rAgua,rEn,rIPTU,rLixo,rOut,rExt,totalRec,totalInad,aguaE,totalDesp,saldoAnt,totalDisp,saldoCond,fu}=f;
  const prev=calcFech(prevMes);
  const prevDec=(dados.meses[`fundo_${prevMes}`]||{}).decisao;

    (val>0||mostraZero)?`<div style="${S};background:${bg}"><span style="color:#444;font-weight:${bold?'600':'400'}">${label}</span><span style="color:${corV};font-weight:${bold?'700':'500'};margin-left:24px;white-space:nowrap">${neg?'− ':''}R$ ${fmtR(val)}</span></div>`:'';
  const sec=label=>`<div style="padding:5px 16px 3px;font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.8px;background:#f7f7f7;border-bottom:1px solid #eee">${label}</div>`;

  const inpV=(v,oc)=>`<div style="display:flex;align-items:center;border:1px solid #e0e0e0;border-radius:5px;overflow:hidden"><span style="padding:2px 5px;font-size:10px;color:#aaa;background:#f5f5f5;border-right:1px solid #e0e0e0">R$</span><input type="number" step="0.01" value="${v}" onchange="${oc}" style="width:90px;padding:2px 6px;border:none;outline:none;font-size:13px;text-align:right"></div>`;

  const despHTML=despList.map((d,idx)=>`
    <div style="${S}">
      <input value="${esc(d.nome||'')}" onchange="setDespFech(${idx},'nome',this.value)" placeholder="Descrição da despesa"

        ${inpV(d.valor||0,`setDespFech(${idx},'valor',this.value)`)}
        <button onclick="remDespFech(${idx})" style="border:none;background:none;color:#e53935;font-size:16px;cursor:pointer">×</button>
      </div>
    </div>`).join('');

  const resultado=totalRec-totalDesp;
  const ovr=(f.pc.agua_edif!==undefined&&f.pc.agua_edif!==null&&f.pc.agua_edif!=='');
  const proxDec=fu.decisao;
  let replBox='';

function gerarContratoFinal(unidId){
  const u=dados.unidades.find(x=>x.id===unidId);if(!u)return;
  const c=dados.cond||{};
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  const nome=g('ct-nome'),cpf=g('ct-cpf'),rg=g('ct-rg'),email=g('ct-email'),tel=g('ct-tel'),endLct=g('ct-end');
  const dataAssin=g('ct-assin')||new Date().toLocaleDateString('pt-BR'),vencContrato=g('ct-venc');
  const aluguel=parseFloat(g('ct-aluguel'))||0,cond=parseFloat(g('ct-cond'))||0,total=aluguel+cond;

// ===== COBRANÇA / RECIBO =====
function enviarCobranca(unidId){
  const u=dados.unidades.find(x=>x.id===unidId);if(!u)return;
  const m=dados.meses[`${u.id}__${mesSel}`]||{};const c=dados.cond||{};
  const total=calcTotal(u,m);
  const pags=(m.pagamentos||[]).reduce((s,pg)=>s+(parseFloat(pg.valor)||0),0);
  const pago=pags>0?pags:(m.quitado?total:(parseFloat(m.pago)||0));
  const saldo=total-pago;
  const nome=(u.locatario&&u.locatario.nome)||'Prezado(a)';
  const tel=(u.locatario&&u.locatario.tel||'').replace(/\D/g,'');
  let itens='';
  if(parseFloat(u.aluguel)>0)itens+=`\n• Aluguel: R$ ${fmtR(parseFloat(u.aluguel))}`;
  if(parseFloat(u.condominio)>0)itens+=`\n• Condomínio: R$ ${fmtR(parseFloat(u.condominio))}`;
  if(parseFloat(m.agua_valor)>0)itens+=`\n• Água: R$ ${fmtR(parseFloat(m.agua_valor))}`;
  if(u.energia_tipo==='percentual'&&parseFloat(m.energia_valor)>0)itens+=`\n• Energia (${u.energia_pct||0}%): R$ ${fmtR(parseFloat(m.energia_valor))}`;
  if(parseFloat(m.iptu)>0)itens+=`\n• IPTU: R$ ${fmtR(parseFloat(m.iptu))}`;
  if(parseFloat(m.lixo)>0)itens+=`\n• Taxa de Lixo: R$ ${fmtR(parseFloat(m.lixo))}`;
  if(parseFloat(m.outros)>0)itens+=`\n• Outros: R$ ${fmtR(parseFloat(m.outros))}`;
  (m.extras||[]).forEach(e=>{if(parseFloat(e.valor)>0)itens+=`\n• ${e.nome||'Extra'}: R$ ${fmtR(parseFloat(e.valor))}`;});
  (m.campos_extras||[]).forEach(e=>{if(e.label)itens+=`\n• ${e.label}: ${e.valor}`;});
  const cau=caucaoInfo(u);
  const cauTxt=cau.saldo>0?`\n\n🔐 *Caução (saldo a pagar): R$ ${fmtR(cau.saldo)}* (combinado R$ ${fmtR(cau.comb)}, pago R$ ${fmtR(cau.pago)})`:'';
  const pix=c.pix||'(a definir)';
  const msg=`Prezado(a) *${nome}*, 🌻\n\nSegue demonstrativo de *${labelMes(mesSel)}* — *${c.nome||'Condomínio Girassol'}, ${u.numero}*:${itens}\n\n*Total: R$ ${fmtR(total)}*${pago>0&&!m.quitado?`\n*Pago: R$ ${fmtR(pago)}*\n*Saldo: R$ ${fmtR(saldo)}*`:''}${cauTxt}\n\nPagamento até o dia *05* via PIX: *${pix}*\n\nAtenciosamente,\n*${c.sindico||'Administração'}*\n${c.tel||''}`;
  if(tel)window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`,'_blank');
  else{navigator.clipboard&&navigator.clipboard.writeText(msg);toast('Número não cadastrado. Mensagem copiada!');}
}

function gerarRecibo(unidId){
  const u=dados.unidades.find(x=>x.id===unidId);if(!u)return;
  const m=dados.meses[`${u.id}__${mesSel}`]||{};const c=dados.cond||{};
  const total=calcTotal(u,m);
  const pags=(m.pagamentos||[]).reduce((s,pg)=>s+(parseFloat(pg.valor)||0),0);
  const pago=pags>0?pags:(m.quitado?total:(parseFloat(m.pago)||0));
  const saldo=Math.max(0,total-pago);
  const lct=u.locatario||{};
  const ultPag=m.pagamentos&&m.pagamentos.length>0?m.pagamentos[m.pagamentos.length-1]:null;
  const dataPag=ultPag?(new Date(ultPag.data+'T12:00:00').toLocaleDateString('pt-BR')):(new Date().toLocaleDateString('pt-BR'));
  const tel=(lct.tel||'').replace(/\D/g,'');
  let itens='';
  if(parseFloat(u.aluguel)>0)itens+=`\n• Aluguel: R$ ${fmtR(parseFloat(u.aluguel))}`;
  if(parseFloat(u.condominio)>0)itens+=`\n• Condomínio: R$ ${fmtR(parseFloat(u.condominio))}`;
  if(parseFloat(m.agua_valor)>0)itens+=`\n• Água: R$ ${fmtR(parseFloat(m.agua_valor))}`;
  if(u.energia_tipo==='percentual'&&parseFloat(m.energia_valor)>0)itens+=`\n• Energia: R$ ${fmtR(parseFloat(m.energia_valor))}`;
  if(parseFloat(m.iptu)>0)itens+=`\n• IPTU: R$ ${fmtR(parseFloat(m.iptu))}`;
  if(parseFloat(m.lixo)>0)itens+=`\n• Taxa de Lixo: R$ ${fmtR(parseFloat(m.lixo))}`;
  (m.extras||[]).forEach(e=>{if(parseFloat(e.valor)>0)itens+=`\n• ${e.nome||'Extra'}: R$ ${fmtR(parseFloat(e.valor))}`;});
  (m.campos_extras||[]).forEach(e=>{if(e.label)itens+=`\n• ${e.label}: ${e.valor}`;});
  const cau=caucaoInfo(u);
  const cauMes=cau.arr.filter(x=>(x.data||'').slice(0,7)===mesSel).reduce((a,x)=>a+(parseFloat(x.valor)||0),0);
  const cauTxt=(cauMes>0||cau.saldo>0)?`\n\n🔐 *Caução:*${cauMes>0?`\n• Recebido neste mês: R$ ${fmtR(cauMes)}`:''}\n• Total pago: R$ ${fmtR(cau.pago)} de R$ ${fmtR(cau.comb)}${cau.saldo>0?`\n• Saldo a pagar: R$ ${fmtR(cau.saldo)}`:' ✓'}`:'';
  const msg=`🧾 *RECIBO DE PAGAMENTO*\n🌻 *${c.nome||'Condomínio Girassol'}*\n\n*Unidade:* ${u.numero}\n*Morador(a):* ${lct.nome||'—'}\n*Competência:* ${labelMes(mesSel)}\n*Data do Pagamento:* ${dataPag}\n\n*Discriminação:*${itens}\n\n*Total: R$ ${fmtR(total)}*\n*Pago: R$ ${fmtR(pago)}*\n${saldo>0?`*Saldo restante: R$ ${fmtR(saldo)}*`:'✓ *Pagamento quitado*'}${cauTxt}\n\n🌻 ${c.sindico||'Administração'}\n${c.tel||''}`;
  if(tel)window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`,'_blank');
  else{navigator.clipboard&&navigator.clipboard.writeText(msg);toast('Número não cadastrado. Recibo copiado!');}
}

async function salvarNuvem(){toast('Salvando...');try{const r=await fetch(SHEETS_URL,{method:'POST',body:JSON.stringify(dados)});const j=await r.json();toast(j.status==='ok'?'✓ Salvo!':'Erro ao salvar!',j.status!=='ok');}catch(e){toast('Erro de conexão!',true);}}
async function carregarNuvem(){if(!confirm('Carregar da nuvem? Dados atuais serão substituídos.'))return;toast('Carregando...');try{const r=await fetch(SHEETS_URL);const j=await r.json();if(j&&j.unidades){dados=j;limparCond();sv();renderTabs();renderContent();toast('✓ Carregado!');}else toast('Nenhum dado encontrado.',true);}catch(e){toast('Erro de conexão!',true);}}

function imprimirDoc(){const inner=document.getElementById('doc-inner');if(!inner)return;const w=window.open('','_blank');w.document.write(`<html><head><title>Documento</title><style>body{font-family:'Times New Roman',serif;font-size:13px;line-height:1.8;padding:30px;max-width:800px;margin:0 auto}h1{text-align:center;font-size:16px;margin-bottom:14px}p{margin-bottom:10px;text-align:justify}.assinaturas{margin-top:50px;display:grid;grid-template-columns:1fr 1fr;gap:30px}.ass{text-align:center;border-top:1px solid #000;padding-top:6px;font-size:12px}</style></head><body>${inner.innerHTML}</body></html>`);w.document.close();w.print();}

function parseDateVenc(vc){if(!vc)return null;const mn={JANEIRO:0,FEVEREIRO:1,MARÇO:2,ABRIL:3,MAIO:4,JUNHO:5,JULHO:6,AGOSTO:7,SETEMBRO:8,OUTUBRO:9,NOVEMBRO:10,DEZEMBRO:11};const partes=vc.toUpperCase().split(' ');const m=mn[partes[partes.length-2]||partes[0]];const a=parseInt(partes[partes.length-1]);if(m===undefined||isNaN(a))return null;return new Date(a,m+1,0);}

function extenso(v){
  if(!v||v===0)return 'zero reais';
  const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const c=['','cem','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  function n(x){x=Math.round(x);if(x===0)return '';if(x===100)return 'cem';if(x<20)return u[x];if(x<100)return d[Math.floor(x/10)]+(x%10?' e '+u[x%10]:'');const r=x%100;return c[Math.floor(x/100)]+(r?' e '+n(r):'');}
  const int=Math.floor(v),cts=Math.round((v-int)*100);let res='';
  if(int>0){if(int>=1000){const mil=Math.floor(int/1000),resto=int%1000;res+=(mil===1?'mil':n(mil)+' mil')+(resto>0?' e '+n(resto):'');}else res+=n(int);res+=int===1?' real':' reais';}
  if(cts>0){if(res)res+=' e ';res+=n(cts)+(cts===1?' centavo':' centavos');}
  return res||'zero reais';
}

function fmtR(v){return (parseFloat(v)||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg,erro=false){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(erro?' erro':'')+' show';setTimeout(()=>t.className='toast'+(erro?' erro':''),3500);}

document.querySelectorAll('.modal-overlay').forEach(o=>{o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('aberto');});});

if(sessionStorage.getItem(AUTH_KEY)==='1'){
  document.getElementById('tela-login').style.display='none';
  document.getElementById('app').style.display='block';
  iniciar();
}
